<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Toolbox – Project Readiness Assessment</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="b3f1f00b-bb9b-4eea-be0a-107d88032ca5"></script>
  <script data-goatcounter="https://oledaw.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>

<body>

  <header>
    <h1>PM Toolbox</h1>
    <p>Ankieta oceny gotowości projektu do startu</p>
  </header>

  <main>

    <!-- Progress bar -->
    <div id="progressWrap">
      <div id="progressLabel">Wypełniono: 0 / 10 pytań</div>
      <div id="progressBar">
        <div id="progressFill"></div>
      </div>
    </div>

    <!-- Form is rendered from data by app.js -->
    <form id="surveyForm" novalidate></form>

    <!-- Results (hidden until form is submitted) -->
    <div id="result">
      <div id="resultHeader" class="result-header"></div>

      <h3 style="color:#163b63;margin-bottom:12px">📊 Wynik per obszar</h3>
      <div class="breakdown-grid" id="breakdownGrid"></div>

      <!-- Action plan is rendered and managed by actionPlan.js -->
      <div class="action-plan" id="actionPlan"></div>

      <h3 style="color:#163b63;margin:0 0 8px">📋 Skala oceny</h3>
      <table class="legend-table">
        <tr><th>Wynik</th><th>Ocena gotowości</th></tr>
        <tr><td>0–49%</td><td>🔴 Projekt niegotowy do startu</td></tr>
        <tr><td>50–79%</td><td>🟡 Projekt częściowo gotowy</td></tr>
        <tr><td>80–100%</td><td>🟢 Projekt gotowy do realizacji</td></tr>
      </table>

      <button type="button" class="btn-json" id="jsonBtn">
        { } Kopiuj pełne podsumowanie jako JSON
      </button>
      <button type="button" class="btn-secondary" id="resetBtn">
        ↺ Wypełnij ponownie
      </button>
    </div>

  </main>

  <!-- Toast notification -->
  <div id="jsonToast"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
